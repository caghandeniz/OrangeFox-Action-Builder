name: OrangeFox - Build (B2_Ultra) + 2 variants

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/caghandeniz/orangefox_device_ant_B2_Ultra'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/ant/B2_Ultra'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'B2_Ultra'

jobs:
  build:
    name: Build OFR (raw vendor_boot)
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
    - name: Checkout (stock files)
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 8

    - name: Build Environment
      run: |
        sudo apt install aria2 lz4 cpio -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        JOBS=$(( $(nproc --all) * 8 ))
        sed -i -E "s/repo sync/repo sync -c --no-clone-bundle --no-tags -j${JOBS}/g" orangefox_sync.sh
        sed -i -E 's/git clone( -q)? /git clone --depth=1\1 /g' orangefox_sync.sh
        TARGET=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        mkdir -p "$(dirname "$TARGET")"
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path "$TARGET"

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone --depth=1 ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        if [ -f twrp_${{ inputs.DEVICE_NAME }}.mk ]; then
          mv twrp_${{ inputs.DEVICE_NAME }}.mk fox_${{ inputs.DEVICE_NAME }}.mk
          sed -i "s/PRODUCT_NAME := twrp_${{ inputs.DEVICE_NAME }}/PRODUCT_NAME := fox_${{ inputs.DEVICE_NAME }}/" fox_${{ inputs.DEVICE_NAME }}.mk
          sed -i "s/twrp_${{ inputs.DEVICE_NAME }}/fox_${{ inputs.DEVICE_NAME }}/g" AndroidProducts.mk vendorsetup.sh 2>/dev/null || true
        fi
        grep -n "TW_INCLUDE_CRYPTO" BoardConfig.mk || echo "crypto kapali"

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch fox_${{ inputs.DEVICE_NAME }}-eng && make clean && mka adbd vendorbootimage

    - name: Upload raw vendor_boot
      uses: actions/upload-artifact@v4
      with:
        name: orangefox-raw-vendor_boot
        path: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img

  pack-ofx-only:
    name: Pack A - OrangeFox ramdisk only
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - name: Download raw vendor_boot
      uses: actions/download-artifact@v4
      with:
        name: orangefox-raw-vendor_boot
        path: raw

    - name: Copy as-is
      run: |
        cp raw/vendor_boot.img vendor_boot_A_ofx_only.img
        sudo apt-get install -y lz4 cpio
        git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
        python3 mkbootimg/unpack_bootimg.py --boot_img vendor_boot_A_ofx_only.img --out unp | grep -E "ramdisk total|dtb address|command line|vendor_ramdisk0"
        ls -l unp/

    - name: Upload variant A
      uses: actions/upload-artifact@v4
      with:
        name: vendor_boot_A_ofx_only
        path: vendor_boot_A_ofx_only.img

  pack-fixed-stock:
    name: Pack B - fixed stock platform ramdisk
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout (stock files)
      uses: actions/checkout@v4

    - name: Download raw vendor_boot
      uses: actions/download-artifact@v4
      with:
        name: orangefox-raw-vendor_boot
        path: raw

    - name: Merge with fixed stock platform ramdisk
      run: |
        set -e
        sudo apt-get install -y lz4 cpio
        git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
        OFX_IMG=raw/vendor_boot.img
        rm -rf mrg && mkdir -p mrg/unp
        python3 mkbootimg/unpack_bootimg.py --boot_img "$OFX_IMG" --out mrg/unp > mrg/hdr.txt
        REC=mrg/unp/vendor_ramdisk01
        [ -f "$REC" ] || { echo "HATA: recovery entry yok"; ls mrg/unp; exit 1; }
        case "$(file -b "$REC")" in
          *gzip*) zcat "$REC" | lz4 -l -9 -f - mrg/rec.lz4 ;;
          *LZ4*|*lz4*) cp "$REC" mrg/rec.lz4 ;;
          *) echo "HATA: bilinmeyen sikistirma: $(file -b "$REC")"; exit 1 ;;
        esac
        S="$GITHUB_WORKSPACE/stock"
        [ -f "$S/platform_ramdisk.lz4" ] || { echo "HATA: stock/platform_ramdisk.lz4 yok"; exit 1; }
        python3 mkbootimg/mkbootimg.py --header_version 4 --pagesize 0x00001000 --base 0x00000000 \
          --kernel_offset 0x40000000 --ramdisk_offset 0x66f00000 --tags_offset 0x47c80000 \
          --dtb_offset 0x0000000047c80000 --vendor_cmdline 'bootopt=64S3,32N2,64N2' --board '' \
          --dtb "$S/dtb" --vendor_bootconfig "$S/bootconfig" \
          --ramdisk_type platform --ramdisk_name '' --vendor_ramdisk_fragment "$S/platform_ramdisk.lz4" \
          --ramdisk_type recovery --ramdisk_name recovery --vendor_ramdisk_fragment mrg/rec.lz4 \
          --vendor_boot vendor_boot_B_fixed_stock.img
        python3 mkbootimg/unpack_bootimg.py --boot_img vendor_boot_B_fixed_stock.img --out mrg/chk | grep -E "ramdisk total|dtb address|command line|vendor_ramdisk0"
        ls -l vendor_boot_B_fixed_stock.img

    - name: Upload variant B
      uses: actions/upload-artifact@v4
      with:
        name: vendor_boot_B_fixed_stock
        path: vendor_boot_B_fixed_stock.img
