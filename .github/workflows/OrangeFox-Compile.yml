name: OrangeFox - Build (B2_Ultra)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/caghandeniz/orangefox_device_ant_B2_Ultra'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/ant/B2_Ultra'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'B2_Ultra'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout (stock files)
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 8

    - name: Build Environment
      run: |
        sudo apt install aria2 lz4 cpio -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync

        # Paralellik sinirsiz: cekirdek sayisinin 8 kati
        JOBS=$(( $(nproc --all) * 8 ))
        echo "repo sync paralel baglanti: $JOBS"
        sed -i -E "s/repo sync/repo sync -c --no-clone-bundle --no-tags -j${JOBS}/g" orangefox_sync.sh
        sed -i -E 's/git clone( -q)? /git clone --depth=1\1 /g' orangefox_sync.sh
        grep -n "repo sync" orangefox_sync.sh | head -5

        TARGET=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        mkdir -p "$(dirname "$TARGET")"

        # Canli ilerleme: her 30 sn'de kullanilan disk, indirilen toplam ve anlik hiz
        (
          PREV=$(df -B1 / --output=used | tail -1 | tr -d ' ')
          START=$(date +%s)
          while true; do
            sleep 30
            NOW_USED=$(df -B1 / --output=used | tail -1 | tr -d ' ')
            DELTA=$(( NOW_USED - PREV ))
            TOTAL=$(( NOW_USED - ${BASE_USED:-$PREV} ))
            ELAPSED=$(( $(date +%s) - START ))
            SPEED_MBS=$(awk "BEGIN {printf \"%.1f\", $DELTA/30/1048576}")
            TOTAL_GB=$(awk "BEGIN {printf \"%.2f\", $TOTAL/1073741824}")
            echo "[$(date +%H:%M:%S)] sure=${ELAPSED}s  anlik_hiz=${SPEED_MBS} MB/s  indirilen=${TOTAL_GB} GB  disk_dolu=$(df -BG / --output=used | tail -1 | tr -d ' ')"
            PREV=$NOW_USED
          done
        ) &
        MON=$!

        export BASE_USED=$(df -B1 / --output=used | tail -1 | tr -d ' ')
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path "$TARGET"
        RC=$?

        kill $MON 2>/dev/null || true
        echo "== Sync bitti. Toplam kullanilan:"
        du -sh
